[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maspy-ml"
version = "2026.5.13"
description = "A Python framework for developing BDI multi-agent systems."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
]

[tool.setuptools.packages.find]
include = ["maspy*"]

[tool.setuptools.package-data]
maspy = ["py.typed", "logger_config.json"]
"maspy.learning" = ["py.typed"]